<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr" th:replace="~{layout :: layout}">
<body>
<div th:fragment="content"
     th:with="activePage='audit',pageTitle='Audit Log',pageSubtitle='Sistemde gerçekleşen önemli aksiyonları izleyin'">
    <div class="page-header">
        <div>
            <h2>Audit Log</h2>
            <p class="page-subtitle">Kullanıcı aksiyonlarını ve sistem olaylarını geriye dönük görüntüleyin.</p>
        </div>
    </div>

    <form class="filter-bar" method="get">
        <div class="filter-group">
            <label for="username">Kullanıcı</label>
            <input id="username" type="text" name="username" th:value="${username}" placeholder="ör. admin"/>
        </div>
        <div class="filter-group">
            <label for="action">Aksiyon</label>
            <input id="action" type="text" name="action" th:value="${action}" placeholder="ör. CREATE, UPDATE, DELETE"/>
        </div>
        <div class="filter-group">
            <label for="resource">Kaynak</label>
            <input id="resource" type="text" name="resource" th:value="${resource}" placeholder="ör. User, Parameter"/>
        </div>
        <div class="filter-actions">
            <button class="btn-ghost" type="submit">Ara</button>
        </div>
    </form>

    <table>
        <thead>
        <tr>
            <th>Zaman</th>
            <th>Kullanıcı</th>
            <th>Aksiyon</th>
            <th>Kaynak</th>
            <th>Detay</th>
            <th>IP</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${page.content.isEmpty()}">
            <td colspan="6" style="text-align: center; padding: 20px; color: var(--color-text-soft);">
                Henüz audit log kaydı bulunmamaktadır.
            </td>
        </tr>
        <tr th:each="log : ${page.content}">
            <td th:text="${#temporals.format(log.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
            <td th:text="${log.username}"></td>
            <td th:text="${log.action}"></td>
            <td th:text="${log.resource}"></td>
            <td th:text="${log.details}"></td>
            <td th:text="${log.ipAddress}"></td>
        </tr>
        </tbody>
    </table>
    <div th:if="${!page.content.isEmpty()}" th:replace="~{fragments/pagination :: pager(${page})}"></div>
</div>
</body>
</html>

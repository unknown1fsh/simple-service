# ====================
# Spring Profile Configuration
# ====================
# Aktif profile'ı belirtir (mysql veya postgresql)
# Varsayılan: mysql
# Profile değiştirmek için: --spring.profiles.active=postgresql
spring.profiles.active=mysql

# ====================
# Thymeleaf Configuration
# ====================
spring.thymeleaf.enabled=true
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ====================
# Static Resources Configuration
# ====================
# Welcome page handling - Thymeleaf template'leri öncelikli
spring.web.resources.add-mappings=true

# ====================
# Logging Configuration
# ====================
logging.level.root=INFO
logging.level.com.example.simple_service=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE